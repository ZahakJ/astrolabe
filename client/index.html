    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/app.css" />
    <!-- After app.css on purpose: the theme library retunes a handful of rules
         app.css states in terms of --accent (selection, focus ring, the graph
         vignette) into per-theme tokens, and the settings sheet is the
         designed surface over app.css's base panel rules. -->
    <link rel="stylesheet" href="/styles/themes.css" />
    <!-- The --vc-* text-colour tokens a note may name in a <span style="color">.
         Here rather than in the editor bundle because colored text has to
         resolve in all three surfaces — editor, reading view and the blog —
         and only one of them ever loads CodeMirror. -->
    <link rel="stylesheet" href="/styles/textcolor.css" />
    <!-- The control set (styled select/toggle/segmented/number), before the
         settings sheet: settings is a SURFACE built out of these primitives,
         so it must be able to adjust them and never the other way round. -->
    <link rel="stylesheet" href="/styles/controls.css" />
    <link rel="stylesheet" href="/styles/settings.css" />
    <!-- Last, and deliberately: the a11y sheet's focus-visible rings, skip link
         and forced-colors fallbacks have to win over both app.css's base chrome
         and the theme library's retuned focus tokens. It adds no colour of its
         own — it reads --accent/--focus like everything else. -->
    <link rel="stylesheet" href="/styles/a11y.css" />
